name: Source secret audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: source-secret-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read repository and fetched history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          import tarfile
          import urllib.request

          url = 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          expected = '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(20 * 1024 * 1024 + 1)
          if len(data) > 20 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Scanner download integrity check failed')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              entry = archive.getmember('gitleaks')
              if not entry.isfile() or entry.size > 32 * 1024 * 1024:
                  raise SystemExit('Unexpected scanner archive')
              binary = archive.extractfile(entry).read()
          target = Path(os.environ['RUNNER_TEMP']) / 'gitleaks-8.30.1'
          target.write_bytes(binary)
          target.chmod(0o700)
          PY

      - name: Audit without publishing credential reports
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/security/secret_scan.py "$RUNNER_TEMP/gitleaks-8.30.1"
